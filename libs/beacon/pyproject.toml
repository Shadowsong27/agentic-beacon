[project]
name = "beacon"
version = "0.2.0"
description = "Distribute knowledge contexts and skills for AI-assisted development teams"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Beacon Contributors" }
]
keywords = ["ai", "agents", "context", "knowledge-management", "developer-tools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "click>=8.1.0",
    "rich>=13.0.0",
    "pyyaml>=6.0.0",
    "loguru>=0.7.0",
]

[project.urls]
Homepage = "https://github.com/Shadowsong27/agentic-engineering-warehouse-template"
Documentation = "https://github.com/Shadowsong27/agentic-engineering-warehouse-template/tree/main/libs/beacon"
Repository = "https://github.com/Shadowsong27/agentic-engineering-warehouse-template"
Issues = "https://github.com/Shadowsong27/agentic-engineering-warehouse-template/issues"

[project.scripts]
beacon = "beacon.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "build>=1.0.0",
    "twine>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/beacon"]
