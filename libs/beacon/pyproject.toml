[project]
name = "agentic-beacon"
version = "2.7.1"
description = "Agentic Beacon CLI - Distribute knowledge contexts and skills for AI-assisted development teams"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Agentic Beacon Contributors" }
]
keywords = ["ai", "agents", "agentic", "context", "knowledge-management", "developer-tools", "beacon"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "click>=8.1.0",
    "rich>=13.0.0",
    "pyyaml>=6.0.0",
    "loguru>=0.7.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "textual>=0.80.0",
]

[project.urls]
Homepage = "https://github.com/Shadowsong27/agentic-beacon"
Documentation = "https://github.com/Shadowsong27/agentic-beacon/tree/main/libs/beacon"
Repository = "https://github.com/Shadowsong27/agentic-beacon"
Issues = "https://github.com/Shadowsong27/agentic-beacon/issues"

[project.scripts]
abc = "beacon.cli.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "build>=1.0.0",
    "twine>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/beacon"]
