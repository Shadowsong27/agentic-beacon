[project]
name = "agentic-beacon-workspace"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "agentic-beacon",
]

[tool.uv]
managed = true

[tool.uv.workspace]
members = ["libs/*"]

[tool.uv.sources]
agentic-beacon = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "pre-commit>=3.0.0",
    "ruff>=0.9.2",
]
docs = [
    "mkdocs-material>=9.5.0",
    "pymdown-extensions>=10.0",
]

[tool.pytest.ini_options]
testpaths = ["libs/beacon/tests"]
asyncio_mode = "auto"
markers = [
    "integration: end-to-end tests that exercise the full CLI workflow (run with -m integration)",
]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long
    "B008", # do not perform function calls in argument defaults
    "C901", # too complex
    "W191", # indentation contains tabs
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
