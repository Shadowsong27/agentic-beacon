name: Publish to PyPI

on:
  push:
    branches:
      - 'release/v*.*.*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - test

env:
  UV_VERSION: "0.5.18"

jobs:
  # ------------------------------------------------------------------
  # E2E tests — must pass before the package is published
  # ------------------------------------------------------------------
  e2e-tests:
    name: E2E Integration Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "libs/beacon/pyproject.toml"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run e2e integration tests
        run: uv run pytest -m integration -v

      - name: Publish summary
        if: always()
        run: |
          echo "## E2E Integration Tests" >> $GITHUB_STEP_SUMMARY
          echo "**Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY

  # ------------------------------------------------------------------
  # Publish — only runs if e2e tests pass
  # ------------------------------------------------------------------
  publish:
    needs: e2e-tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write       # For trusted publishing
      pull-requests: write  # For creating release comments on PRs

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "libs/beacon/pyproject.toml"

      - name: Install the project
        run: uv sync --directory libs/beacon

      - name: Build package
        working-directory: libs/beacon
        run: |
          echo "Building agentic-beacon..."
          uv build --out-dir dist
          echo "Build complete!"
          ls -lh dist/

      - name: Determine PyPI target
        id: pypi_target
        run: |
          # Default to production for release branches
          # Only use test when explicitly requested via workflow_dispatch
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]] && [[ "${{ inputs.environment }}" == "test" ]]; then
            echo "target=test" >> $GITHUB_OUTPUT
            echo "url=https://test.pypi.org/project/agentic-beacon/" >> $GITHUB_OUTPUT
            echo "publish_url=https://test.pypi.org/legacy/" >> $GITHUB_OUTPUT
          else
            echo "target=production" >> $GITHUB_OUTPUT
            echo "url=https://pypi.org/project/agentic-beacon/" >> $GITHUB_OUTPUT
            echo "publish_url=https://upload.pypi.org/legacy/" >> $GITHUB_OUTPUT
          fi

      - name: Publish to PyPI (with API token)
        if: steps.pypi_target.outputs.target == 'production'
        working-directory: libs/beacon
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          echo "Publishing to PyPI..."
          uv publish --token "$UV_PUBLISH_TOKEN"
          echo "✓ Published to PyPI!"

      - name: Publish to TestPyPI (with API token)
        if: steps.pypi_target.outputs.target == 'test'
        working-directory: libs/beacon
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.TEST_PYPI_API_TOKEN }}
          UV_PUBLISH_URL: ${{ steps.pypi_target.outputs.publish_url }}
        run: |
          echo "Publishing to TestPyPI..."
          uv publish --publish-url "$UV_PUBLISH_URL" --token "$UV_PUBLISH_TOKEN"
          echo "✓ Published to TestPyPI!"

      - name: Get package version
        id: version
        working-directory: libs/beacon
        run: |
          VERSION=$(grep '^version = ' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Publish summary
        if: always()
        run: |
          echo "## 📦 Agentic Beacon Publication" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "**Package**: agentic-beacon" >> $GITHUB_STEP_SUMMARY
          echo "**Version**: ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Target**: ${{ steps.pypi_target.outputs.target }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ job.status }}" == "success" ]]; then
            echo "### ✅ Publication Successful!" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**PyPI URL**: ${{ steps.pypi_target.outputs.url }}" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 📥 Installation" >> $GITHUB_STEP_SUMMARY
            echo '```bash' >> $GITHUB_STEP_SUMMARY

            if [[ "${{ steps.pypi_target.outputs.target }}" == "test" ]]; then
              echo "pip install --index-url https://test.pypi.org/simple/ agentic-beacon" >> $GITHUB_STEP_SUMMARY
            else
              echo "pip install agentic-beacon" >> $GITHUB_STEP_SUMMARY
            fi

            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 🚀 Quick Start" >> $GITHUB_STEP_SUMMARY
            echo '```bash' >> $GITHUB_STEP_SUMMARY
            echo "abc init my-warehouse" >> $GITHUB_STEP_SUMMARY
            echo "abc setup --all" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ Publication Failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Check the logs above for details." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload build artifacts for bundling
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: libs/beacon/dist/

      - name: Create release comment
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/') && job.status == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const version = '${{ steps.version.outputs.version }}';
            const body = `## 🎉 Package Published to PyPI

            **agentic-beacon v${version}** is now available on PyPI!

            ### Installation
            \`\`\`bash
            pip install agentic-beacon
            \`\`\`

            ### Quick Start
            \`\`\`bash
            abc init my-warehouse
            abc setup --all
            abc status
            \`\`\`

            ### Links
            - [PyPI Package](https://pypi.org/project/agentic-beacon/${version}/)
            - [Documentation](https://github.com/Shadowsong27/agentic-beacon)
            `;

            // Find the latest release PR
            const prs = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'closed',
              sort: 'updated',
              direction: 'desc',
              per_page: 10
            });

            const releasePR = prs.data.find(pr =>
              pr.title.includes('release agentic-beacon') &&
              pr.merged_at
            );

            if (releasePR) {
              github.rest.issues.createComment({
                issue_number: releasePR.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }

  # ------------------------------------------------------------------
  # Offline bundles — build per-platform wheel bundles and attach to
  # the GitHub release so users can install without PyPI access.
  # ------------------------------------------------------------------
  bundle:
    needs: publish
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
          - os: macos-latest
            platform: macos-arm64
          - os: windows-latest
            platform: windows-x86_64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write   # needed to upload release assets

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}

      - name: Get package version
        id: version
        shell: bash
        run: |
          VERSION=$(grep '^version = ' libs/beacon/pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Download wheels (package + all dependencies)
        shell: bash
        run: |
          mkdir -p offline-bundle
          uvx pip download "agentic-beacon==${{ steps.version.outputs.version }}" \
            --only-binary=:all: \
            -d ./offline-bundle/

      - name: Create bundle zip
        shell: bash
        run: |
          BUNDLE="agentic_beacon-${{ steps.version.outputs.version }}-bundle-${{ matrix.platform }}.zip"
          python3 -c "
          import zipfile, os
          bundle_dir = './offline-bundle'
          with zipfile.ZipFile('$BUNDLE', 'w', zipfile.ZIP_DEFLATED) as zf:
              for f in os.listdir(bundle_dir):
                  zf.write(os.path.join(bundle_dir, f), f)
          print(f'Created $BUNDLE')
          "
          echo "BUNDLE=$BUNDLE" >> $GITHUB_ENV

      - name: Upload bundle to GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "agentic-beacon@v${{ steps.version.outputs.version }}" \
            "${{ env.BUNDLE }}" \
            --clobber
