name: CI

on:
  push:
    branches-ignore:
      - main
      - 'release/**'
    paths:
      - 'libs/beacon/**'
      - 'pyproject.toml'
      - '.github/workflows/**'
  pull_request:
    branches:
      - main
    paths:
      - 'libs/beacon/**'
      - 'pyproject.toml'
      - '.github/workflows/**'

env:
  UV_VERSION: "0.5.18"

jobs:
  # ------------------------------------------------------------------
  # Unit tests — runs on every feat branch push and every PR
  # ------------------------------------------------------------------
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Pinned explicitly (not python-version-file) so the runner does not
          # drift to a newer Python the moment one becomes the ubuntu-latest
          # default (e.g. 3.14, which broke this PR's CI on 2026-05-17 via a
          # transitive Click 8.4.0 error-format change). Local dev runs 3.12;
          # match it. Bump deliberately when upgrading the project.
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Configure git identity (required by warehouse contribute tests)
        run: |
          git config --global user.email "ci@agentic-beacon.test"
          git config --global user.name "Agentic Beacon CI"

      - name: Check shared scripts are in sync
        run: python libs/beacon/scripts/sync_shared_scripts.py --check

      - name: Run unit tests
        run: uv run pytest -m "not integration" -q

      - name: Publish summary
        if: always()
        run: |
          echo "## Unit Tests" >> $GITHUB_STEP_SUMMARY
          echo "**Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY

  # ------------------------------------------------------------------
  # E2E tests — runs only on PRs to main, after unit tests pass
  # ------------------------------------------------------------------
  e2e-tests:
    name: E2E Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Pinned explicitly (not python-version-file) so the runner does not
          # drift to a newer Python the moment one becomes the ubuntu-latest
          # default (e.g. 3.14, which broke this PR's CI on 2026-05-17 via a
          # transitive Click 8.4.0 error-format change). Local dev runs 3.12;
          # match it. Bump deliberately when upgrading the project.
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Configure git identity (required by warehouse contribute tests)
        run: |
          git config --global user.email "ci@agentic-beacon.test"
          git config --global user.name "Agentic Beacon CI"

      - name: Pre-warm uv cache for PEP 723 deps
        run: uv run --no-project --isolated --with pyyaml python -c "import yaml"

      - name: Run e2e integration tests
        run: uv run pytest -m integration -v

      - name: Publish summary
        if: always()
        run: |
          echo "## E2E Integration Tests" >> $GITHUB_STEP_SUMMARY
          echo "**Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
