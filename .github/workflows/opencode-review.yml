name: opencode-review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  review:
    uses: Shadowsong27/gh-actions-commons/.github/workflows/opencode-review.yml@main
    with:
      model: ${{ vars.OPENCODE_REVIEW_MODEL || 'openai/gpt-5.5' }}
      prompt-file: '.github/opencode-pr-review-prompt.md'
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}
