name: opencode-review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: opencode-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: |
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: self-hosted

    permissions:
      contents: read
      issues: write
      pull-requests: read

    env:
      OPENCODE_REVIEW_MODEL: ${{ vars.OPENCODE_REVIEW_MODEL || 'openai/gpt-5.5' }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch base branch
        run: git fetch origin ${{ github.base_ref }}

      - name: Generate PR diff
        run: git diff --merge-base origin/${{ github.base_ref }} HEAD > /tmp/opencode-pr.diff

      - name: Run OpenCode review
        env:
          PATH: /home/runner/.opencode/bin:/home/runner/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        run: |
          opencode run --model "$OPENCODE_REVIEW_MODEL" --title "PR review #${{ github.event.pull_request.number }}" "$(cat <<'EOF'
          Review this pull request for the agentic-beacon repository.

          Follow AGENTS.md and the project architecture rules.

          Review only the diff below. Prioritize:
          - correctness bugs
          - behavioral regressions
          - architecture violations
          - missing or weak tests
          - security or safety issues
          - user-facing CLI behavior changes
          - documentation drift when behavior changes

          Output findings first, ordered by severity.
          Include file and line references when possible.
          If there are no findings, say so explicitly.
          Keep the review concise and actionable.

          Diff:
          EOF
          cat /tmp/opencode-pr.diff
          )" | tee /tmp/opencode-review.md

      - name: Publish step summary
        run: |
          echo "## OpenCode PR Review" >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/opencode-review.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upsert PR review comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs")
            const marker = "<!-- opencode-pr-review -->"
            const review = fs.readFileSync("/tmp/opencode-review.md", "utf8").trim()
            const body = [
              marker,
              "",
              "## OpenCode Review",
              "",
              `Model: \`${process.env.OPENCODE_REVIEW_MODEL}\``,
              `Reviewed commit: \`${context.payload.pull_request.head.sha}\``,
              `Workflow run: ${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              "",
              review || "OpenCode produced no review output.",
            ].join("\n")

            const { owner, repo } = context.repo
            const issue_number = context.payload.pull_request.number
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            })
            const existing = comments.find((comment) => comment.body.includes(marker))

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              })
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              })
            }
