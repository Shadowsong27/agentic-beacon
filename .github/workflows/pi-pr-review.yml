name: pi PR Review

# The automated PR reviewer (HARN-79), consumed as a REUSABLE WORKFLOW from
# Shadowsong27/gh-actions-commons. This file is the whole install.
#
# The reviewer's internals — the read-only review jobs and the write-scoped post job,
# the checkout-credential scrub, the fork guard, the shared prompt and the review
# extractor — live in the reusable workflow. Do NOT copy them back into this repo:
# per-repo copies drift silently out of sync with the shared fixes.
#
# Advisory by design: a green check means THE JOB RAN, never "no findings".
# Read findings as ISSUE comments (`gh api repos/<o>/<r>/issues/<n>/comments`).

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # Rebuttal re-review: `gh workflow run pi-pr-review.yml -f pr-number=<n>` reviews the
  # PR's current head again after a rebuttal comment, with no new commit. The shared
  # workflow gates it (a trusted comment newer than the last review, one re-review per
  # commit). `workflow_dispatch` runs the caller from the default branch, so this takes
  # effect once merged to main.
  workflow_dispatch:
    inputs:
      pr-number:
        description: PR to re-review after a rebuttal comment
        required: true
        type: string

# NOTE: deliberately no `concurrency:` block. The reusable workflow cancels
# superseded runs itself, and a caller sharing a concurrency group with its
# callee DEADLOCKS.

jobs:
  pi-review:
    uses: Shadowsong27/gh-actions-commons/.github/workflows/pi-pr-review.yml@main
    # Ceiling for the reusable workflow. An explicit block sets every UNLISTED
    # scope to `none`, so it must cover the union of the callee's per-job
    # permissions. Missing `actions: read` (the `gate` job) makes GitHub reject
    # the run with `startup_failure` and NO check run, so the PR reads green while
    # nothing reviewed it. When bumping the callee, diff its per-job permissions.
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
    with:
      # Ordered, tried left to right; the first model yielding a usable review wins and
      # is named in the comment. Different PROVIDERS on purpose: the failure absorbed is
      # provider-side quota exhaustion. Every name must be registered in the runner's
      # ~/.pi/agent/models.json.
      # DeepSeek first: it is the model that answers here, and it is slow. A large PR
      # (AB-106, #180: 33 files) needed more than the default 510s per attempt.
      pi-models: opencode-go/go-deepseek-v4.1-flash,litellm-responses/gpt-5.6-terra-medium
      timeout-minutes: 60
      pi-attempt-timeout-minutes: 25
      # Rebuttal re-review: forwards the dispatch input; empty on every other trigger.
      pr-number: ${{ inputs.pr-number }}

      # Repo-specific rules are appended automatically from the default path
      # `.github/opencode-pr-review-prompt.md`.

      # No Claude fallback here on purpose: this repo is public with outside
      # collaborators, and the fallback needs the owner's personal Claude subscription
      # token as a repo secret, which any collaborator's branch workflow could read.
